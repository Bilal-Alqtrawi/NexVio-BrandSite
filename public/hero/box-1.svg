<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <!-- Frame Drop Shadows -->
    <filter id="laptopShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#1A2E35" flood-opacity="0.18"></feDropShadow>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"></feDropShadow>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1A2E35" flood-opacity="0.05"></feDropShadow>
    </filter>

    <!-- Clip Path for Screen Content -->
    <clipPath id="screenClip">
      <rect x="140" y="80" width="720" height="450" rx="12" ry="12"></rect>
    </clipPath>
  </defs>

  <style>
    .bold-txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .med-txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
    .reg-txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; }
  </style>

  <g filter="url(#laptopShadow)">
    <!-- Laptop Outer Body / Screen Bezel -->
    <rect x="125" y="65" width="750" height="480" rx="20" ry="20" fill="#0D181C" stroke="#2A3E46" stroke-width="2"></rect>
    
    <!-- Screen Inner Border -->
    <rect x="135" y="75" width="730" height="460" rx="14" ry="14" fill="#14242A"></rect>

    <!-- Screen Dashboard Content -->
    <g clip-path="url(#screenClip)">
      <!-- Dashboard Base BG -->
      <rect x="140" y="80" width="720" height="450" fill="#F8FAFC"></rect>

      <!-- 1. LEFT SIDEBAR -->
      <g id="sidebar">
        <rect x="140" y="80" width="140" height="450" fill="#24282C"></rect>
        
        <!-- Header / Logo Area -->
        <circle cx="160" cy="102" r="7" fill="#FFCC00"></circle>
        <text x="174" y="106" fill="#FFFFFF" class="bold-txt" font-size="11">NexVio Cloud</text>
        <line x1="140" y1="120" x2="280" y2="120" stroke="#33373B" stroke-width="1"></line>

        <!-- Menu Title -->
        <text x="152" y="138" fill="#7A9CA5" class="bold-txt" font-size="8" letter-spacing="0.5">MAIN MENU</text>

        <!-- Menu Item Active -->
        <rect x="146" y="148" width="128" height="24" rx="4" fill="#34393E"></rect>
        <rect x="146" y="148" width="3" height="24" rx="1.5" fill="#FFCC00"></rect>
        <text x="162" y="164" fill="#FFFFFF" class="bold-txt" font-size="9.5">Dashboard</text>

        <!-- Menu Items Inactive -->
        <g fill="#94A3B8" class="med-txt" font-size="9">
          <text x="162" y="194">Administration</text>
          <text x="162" y="220">Partners</text>
          <text x="162" y="246">Catalog</text>
          <text x="162" y="272">Company</text>
          <text x="162" y="298">Promotions</text>
          <text x="162" y="324">Employees</text>
          <text x="162" y="350">Finance</text>
          <text x="162" y="376">Sales</text>
          <text x="162" y="402">Reports</text>
        </g>
      </g>

      <!-- 2. TOP NAVBAR -->
      <g id="navbar">
        <rect x="280" y="80" width="580" height="40" fill="#FFFFFF"></rect>
        <line x1="280" y1="120" x2="860" y2="120" stroke="#E2E8F0" stroke-width="1"></line>
        
        <!-- Top Title & Icons -->
        <text x="296" y="105" fill="#1A2E35" class="bold-txt" font-size="13">Dashboard</text>
        
        <!-- Action Buttons Right -->
        <circle cx="800" cy="100" r="10" fill="#F1F5F9"></circle>
        
        <circle cx="844" cy="100" r="7" fill="#FFCC00"></circle>
      </g>

      <!-- 3. DASHBOARD MAIN CONTENT AREA -->
      
      <!-- Top Stat Box 1: Items -->
      <g filter="url(#cardShadow)">
        <rect x="560" y="132" width="284" height="85" rx="8" fill="#FFFFFF"></rect>
        <text x="572" y="148" fill="#1A2E35" class="bold-txt" font-size="10">Items</text>
        
        <!-- Mini Stats Grid -->
        <g>
          <!-- Column 1 -->
          <text x="580" y="168" fill="#0F172A" class="bold-txt" font-size="12">573</text>
          <text x="572" y="180" fill="#64748B" class="reg-txt" font-size="7.5">Total sold items</text>
          <text x="580" y="193" fill="#10B981" class="bold-txt" font-size="8">▲ 13.0%</text>

          <line x1="650" y1="158" x2="650" y2="198" stroke="#F1F5F9" stroke-width="1"></line>

          <!-- Column 2 -->
          <text x="670" y="168" fill="#0F172A" class="bold-txt" font-size="12">1.83</text>
          <text x="658" y="180" fill="#64748B" class="reg-txt" font-size="7.5">Avg items / sale</text>
          <text x="670" y="193" fill="#10B981" class="bold-txt" font-size="8">▲ 2.9%</text>

          <line x1="740" y1="158" x2="740" y2="198" stroke="#F1F5F9" stroke-width="1"></line>

          <!-- Column 3 -->
          <text x="760" y="168" fill="#0F172A" class="bold-txt" font-size="12">3.05</text>
          <text x="748" y="180" fill="#64748B" class="reg-txt" font-size="7.5">Avg item price</text>
          <text x="760" y="193" fill="#10B981" class="bold-txt" font-size="8">▲ 11.2%</text>
        </g>
      </g>

      <!-- Chart 1: Revenue -->
      <g filter="url(#cardShadow)">
        <rect x="296" y="132" width="250" height="180" rx="8" fill="#FFFFFF"></rect>
        <text x="308" y="150" fill="#1A2E35" class="bold-txt" font-size="10">Revenue</text>
        <text x="308" y="164" fill="#64748B" class="bold-txt" font-size="9">1,738</text>

        <!-- Chart Grid Lines -->
        <path d="M 310 180 L 530 180 M 310 205 L 530 205 M 310 230 L 530 230 M 310 255 L 530 255 M 310 280 L 530 280" stroke="#F1F5F9" stroke-width="1" data-index="0"></path>

        <!-- Chart Paths (Yellow / Gray) -->
        <path d="M 315 260 Q 330 220 340 240 T 360 190 T 380 270 T 400 230 T 420 210 T 440 260 T 460 220 T 480 250 T 500 200 T 525 240" fill="none" stroke="#CBD5E1" stroke-width="1.5" data-index="1"></path>
        <path d="M 315 270 Q 330 240 340 210 T 360 170 T 380 250 T 400 200 T 420 240 T 440 210 T 460 250 T 480 200 T 500 230 T 525 210" fill="none" stroke="#FFCC00" stroke-width="2" data-index="2"></path>
        
        <!-- Legend -->
        
        <text x="396" y="301" fill="#64748B" class="med-txt" font-size="7.5">Current</text>
        <circle cx="435" cy="298" r="3" fill="#CBD5E1"></circle>
        <text x="441" y="301" fill="#64748B" class="med-txt" font-size="7.5">Previous</text>
      </g>

      <!-- Stat Box 2: Sales Overview -->
      <g filter="url(#cardShadow)">
        <rect x="560" y="227" width="284" height="85" rx="8" fill="#FFFFFF"></rect>
        <text x="572" y="243" fill="#1A2E35" class="bold-txt" font-size="10">Sales Overview</text>
        
        <!-- Mini Stats Grid -->
        <g>
          <!-- Column 1 -->
          <text x="590" y="263" fill="#0F172A" class="bold-txt" font-size="12">24</text>
          <text x="580" y="275" fill="#64748B" class="reg-txt" font-size="7.5">Discounts</text>
          <text x="582" y="288" fill="#EF4444" class="bold-txt" font-size="8">▼ -11.7%</text>

          <line x1="650" y1="253" x2="650" y2="293" stroke="#F1F5F9" stroke-width="1"></line>

          <!-- Column 2 -->
          <text x="685" y="263" fill="#0F172A" class="bold-txt" font-size="12">0</text>
          <text x="674" y="275" fill="#64748B" class="reg-txt" font-size="7.5">Returns</text>
          <text x="672" y="288" fill="#64748B" class="bold-txt" font-size="8">━ 0.0%</text>

          <line x1="740" y1="253" x2="740" y2="293" stroke="#F1F5F9" stroke-width="1"></line>

          <!-- Column 3 -->
          <text x="758" y="263" fill="#0F172A" class="bold-txt" font-size="12">1,714</text>
          <text x="758" y="275" fill="#64748B" class="reg-txt" font-size="7.5">Net sales</text>
          <text x="756" y="288" fill="#10B981" class="bold-txt" font-size="8">▲ 26.4%</text>
        </g>
      </g>

      <!-- Chart 2: Transactions -->
      <g filter="url(#cardShadow)">
        <rect x="296" y="322" width="250" height="180" rx="8" fill="#FFFFFF"></rect>
        <text x="308" y="340" fill="#1A2E35" class="bold-txt" font-size="10">Transactions</text>
        <text x="308" y="354" fill="#64748B" class="bold-txt" font-size="9">214</text>

        <!-- Chart Grid Lines -->
        

        <!-- Chart Paths -->
        <path d="M 315 460 Q 330 430 340 450 T 360 410 T 380 470 T 400 420 T 420 440 T 440 390 T 460 430 T 480 410 T 500 450 T 525 420" fill="none" stroke="#CBD5E1" stroke-width="1.5" data-index="4"></path>
        <path d="M 315 450 Q 330 410 340 430 T 360 380 T 380 440 T 400 390 T 420 410 T 440 370 T 460 420 T 480 390 T 500 420 T 525 390" fill="none" stroke="#FFCC00" stroke-width="2" data-index="5"></path>
      </g>

      <!-- Table Box: Top Sellers -->
      <g filter="url(#cardShadow)">
        <rect x="560" y="322" width="284" height="180" rx="8" fill="#FFFFFF"></rect>
        <text x="572" y="340" fill="#1A2E35" class="bold-txt" font-size="10">Top sellers</text>
        
        <!-- Table Header -->
        <text x="730" y="356" fill="#94A3B8" class="bold-txt" font-size="7.5">Rev ⇅</text>
        <text x="765" y="356" fill="#94A3B8" class="bold-txt" font-size="7.5">Avg ⇅</text>
        <text x="795" y="356" fill="#94A3B8" class="bold-txt" font-size="7.5">Rev / hour ⇅</text>
        <line x1="570" y1="363" x2="832" y2="363" stroke="#F1F5F9" stroke-width="1"></line>

        <!-- Table Row 1 -->
        <text x="572" y="380" fill="#475569" class="med-txt" font-size="8">General employees</text>
        <rect x="630" y="375" width="80" height="5" rx="2.5" fill="#FFCC00"></rect>
        <text x="730" y="380" fill="#1E293B" class="bold-txt" font-size="8">1,738</text>
        <text x="770" y="380" fill="#1E293B" class="reg-txt" font-size="8">4</text>
        <text x="802" y="380" fill="#1E293B" class="reg-txt" font-size="8">19.92</text>
      </g>
    </g>

    <!-- Laptop Notch -->
    <path d="M 460 75 L 540 75 L 534 87 C 532 90 528 92 524 92 L 476 92 C 472 92 468 90 466 87 Z" fill="#0D181C" data-index="6"></path>
    <circle cx="500" cy="83" r="2.5" fill="#1E293B"></circle>
  </g>

  <!-- 4. LAPTOP BOTTOM HINGE & YELLOW BASE -->
  <g id="laptopBase" filter="url(#laptopShadow)">
    <!-- Hinge -->
    
    
    <!-- Yellow Laptop Base Lip -->
    <path d="M 110 545 L 890 545 L 870 560 C 865 563 855 565 845 565 L 155 565 C 145 565 135 563 130 560 Z" fill="#FFCC00" data-index="7" style="opacity: 1;"></path>
    <!-- Base Top Highlight Border -->
    
    <!-- Base Center Opening Notch -->
    <path d="M 460 545 C 460 549 465 551 470 551 L 530 551 C 535 551 540 549 540 545 Z" fill="#E6B800" data-index="9"></path>
  </g>
</svg>